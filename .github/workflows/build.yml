# Automatic build + deploy to GitHub Pages (gh-pages branch) on every push to main.
# Owner-page compatible: checkout -> hugo -> push ./public to gh-pages via git worktree.
name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # push to gh-pages

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
          extended: true

      - name: Build Site
        run: hugo --minify --gc

      - name: Setup Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/pages
          mkdir -p /tmp/pages
          git worktree add -B gh-pages /tmp/pages gh-pages || { git init /tmp/pages; (cd /tmp/pages && git checkout -b gh-pages); }
          cd /tmp/pages
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} + 2>/dev/null || true
          cp -r "$GITHUB_WORKSPACE/public/." .
          touch .nojekyll
          git add -A
          git commit -m "Deploy: $(cd $GITHUB_WORKSPACE && git rev-parse --short HEAD)" || echo "No changes"
          git push origin gh-pages --force
