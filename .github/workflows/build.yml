# Automatic build + deploy to GitHub Pages (gh-pages branch) on every push to main.
# Owner-page compatible: checkout -> hugo -> git init + push ./public to gh-pages.
name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # push to gh-pages

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
          extended: true

      - name: Build Site
        run: hugo --minify --gc

      - name: Deploy to gh-pages
        run: |
          set -euxo pipefail
          # Fresh orphan branch for the built site
          rm -rf /tmp/pages
          mkdir -p /tmp/pages
          cp -r "$GITHUB_WORKSPACE/public/." /tmp/pages/
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy: $(cd $GITHUB_WORKSPACE && git rev-parse --short HEAD)"
          git remote add origin https://github.com/sylvestrekook/sylvestrekook.github.io.git
          git push origin gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
